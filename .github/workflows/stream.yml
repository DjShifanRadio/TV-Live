name: Facebook Live Stream 4 Hours

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Video or Stream URL (Direct MP4/M3U8 link)'
        required: true
        default: ''
      stream_key:
        description: 'Facebook Live Stream Key'
        required: true
        default: ''
      logo_url:
        description: 'Logo Image URL (Optional: leave blank to use default logo)'
        required: false
        default: ''

jobs:
  run-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 245  # 4 மணி 5 நிமிடங்களுக்கு பின் வேலை நிறுத்தப்படும்

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Setup Logo Image
      run: |
        USER_LOGO="${{ github.event.inputs.logo_url }}"
        DEFAULT_LOGO="https://play-lh.googleusercontent.com/5DiOy01r-5O5xeTMaQZwQxSkJxJOC684cm0-jc9SH64Zi9bFF_ld0-n86tGNnduSNVIEn_rNG2LgQFf8RLJY"
        
        if [ -z "$USER_LOGO" ]; then
          echo "இயல்புநிலை (Default) லோகோ பயன்படுத்தப்படுகிறது."
          curl -L "$DEFAULT_LOGO" -o logo.png
        else
          echo "புதிய லோகோ URL பயன்படுத்தப்படுகிறது."
          curl -L "$USER_LOGO" -o logo.png || curl -L "$DEFAULT_LOGO" -o logo.png
        fi

    - name: Start Live Streaming to Facebook with Auto-Reconnect
      run: |
        # ஸ்ட்ரீம் கட்டளை திடீரென நின்றால் தானாகவே மறுபடியும் இணைக்கும் லூப் அமைப்பு (Auto-Reconnect Loop)
        # -t 14400 -> மொத்தம் 4 மணி நேரம் வரை இயங்கும்
        
        end_time=$(($(date +%s) + 14400))
        
        while [ $(date +%s) -lt $end_time ]; do
          echo "நேரலை ஒளிபரப்பு தொடங்குகிறது..."
          
          ffmpeg -re \
            -i "${{ github.event.inputs.video_url }}" \
            -i logo.png \
            -filter_complex "[1:v]scale=80:-1[scaled_logo];[0:v][scaled_logo]overlay=W-w-20:10" \
            -c:v libx264 -preset veryfast -b:v 1800k -maxrate 1800k -bufsize 3600k \
            -pix_fmt yuv420p -g 50 -r 30 \
            -c:a aac -b:a 128k -ar 44100 \
            -f flv \
            "rtmps://live-api-s.facebook.com:443/rtmp/${{ github.event.inputs.stream_key }}" || true
            
          echo "தற்காலிகத் தடை ஏற்பட்டது. 5 வினாடிகளுக்குப் பிறகு மீண்டும் இணைக்கப்படுகிறது..."
          sleep 5
        done
